name: Desktop Builds
# Builds macOS and Windows desktop artifacts.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create when run manually. Defaults to desktop-build-<run_number>.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos-universal:
    name: macOS universal apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build macOS apps
        run: SHIP_MACOS_BUILD_MODE=universal MACOSX_DEPLOYMENT_TARGET=12.0 ./scripts/build_apps_py312.sh
      - name: Verify code signatures
        run: |
          codesign --verify --deep --strict "release/선적전송.app"
          codesign --verify --deep --strict "release/선적관리.app"
          codesign --verify --deep --strict "release/전송로그.app"
      - name: Package macOS apps
        run: |
          mkdir -p artifacts/macos
          ditto -c -k --sequesterRsrc --keepParent "release/선적전송.app" "artifacts/macos/선적전송-macos12-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "release/선적관리.app" "artifacts/macos/선적관리-macos12-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "release/전송로그.app" "artifacts/macos/전송로그-macos12-universal.zip"
          shasum -a 256 artifacts/macos/*.zip > artifacts/macos/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-apps
          path: artifacts/macos/*

  windows-x64:
    name: Windows x64 installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows installers
        shell: pwsh
        run: .\scripts\build_apps_windows.ps1 -Python python -Target x86_64-pc-windows-msvc
      - name: Checksum Windows installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\windows | Out-Null
          Copy-Item release-windows\*.exe artifacts\windows\
          Get-ChildItem artifacts\windows\*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content artifacts\windows\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installers
          path: artifacts/windows/*

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos-universal
      - windows-x64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-apps
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installers
          path: artifacts/windows
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "artifacts/macos/선적전송-macos12-universal.zip" release-assets/ship-sender-macos12-universal.zip
          cp "artifacts/macos/선적관리-macos12-universal.zip" release-assets/ship-manager-macos12-universal.zip
          cp "artifacts/macos/전송로그-macos12-universal.zip" release-assets/ship-log-viewer-macos12-universal.zip
          cp "artifacts/windows/선적전송_0.1.0_x64-setup.exe" release-assets/ship-sender-windows-x64-setup.exe
          cp "artifacts/windows/선적관리_0.1.0_x64-setup.exe" release-assets/ship-manager-windows-x64-setup.exe
          cp "artifacts/windows/전송로그_0.1.0_x64-setup.exe" release-assets/ship-log-viewer-windows-x64-setup.exe
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Select release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            release_tag="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            release_tag="${{ github.event.inputs.release_tag }}"
          else
            release_tag="desktop-build-${{ github.run_number }}"
          fi
          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
          printf 'RELEASE_TITLE=Ship Desktop %s\n' "$release_tag" >> "$GITHUB_ENV"
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Desktop build assets generated by GitHub Actions.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}
          EOF
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
